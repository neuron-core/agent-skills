name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        neuron: ['4.0.0', '^4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pdo, pdo_sqlite, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer update --with "neuron-core/neuron-ai:${{ matrix.neuron }}" --no-interaction --prefer-dist
      - run: composer show neuron-core/neuron-ai
      - run: composer test
      - run: composer analyse

  yaml-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            platform: '8.2.0'
            yaml: '7.4.*'
          - php: '8.4'
            platform: '8.4.1'
            yaml: '8.1.*'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pdo, pdo_sqlite, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer config platform.php ${{ matrix.platform }}
      - run: composer update --with "symfony/yaml:${{ matrix.yaml }}" --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse
